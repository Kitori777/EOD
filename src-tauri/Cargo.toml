[package]
name = "eyes-of-odin"
version = "0.1.0"
description = "Interaktywne laboratorium danych i scenariuszy what-if"
authors = ["Eyes of Odin"]
edition = "2021"

[lib]
name = "eyes_of_odin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
